name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (.NET 8)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore OxygenMarketing.sln

    - name: Build solution (Release)
      run: dotnet build OxygenMarketing.sln -c Release --no-restore

    - name: Run tests
      run: dotnet test OxygenMarketing.sln -c Release --no-build --verbosity normal
